
networks:
  home-server:
    external: true

services:
  home_server_api:
    networks:
      - home-server
    build: .
    container_name: home_server_api
    environment:
      CONFIG_FILE: /run/secrets/config.json
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    ports:
      - 5001:5001
    restart: always  # Restart if the container crashes
    command: ["python", "-u", "index.py"]
    privileged: true

