
networks:
  home-server:
    external: true

services:
  homeserver-api:
    networks:
      - home-server
    build:
      context: .
      network: host
    container_name: homeserver-api
    environment:
      CONFIG_FILE: /run/secrets/config.json
      PYTHONUNBUFFERED: 1
      TZ: America/Vancouver
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    ports:
      - 5001:5001
    expose:
      - 5001
    restart: always  # Restart if the container crashes
    command: ["flask", "--app", "index.py", "run", "--host=0.0.0.0", "--port=5001", "--reload"]
    privileged: true

