
networks:
  home-server:
    external: true

services:
  webserver:
    networks:
      - home-server
    build: .
    container_name: webserver
    environment:
      CONFIG_FILE: /run/secrets/config.json
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    ports:
      - 5001:5001
    expose:
      - 5001
    restart: always  # Restart if the container crashes
    command: ["python", "-u", "index.py"]
    privileged: true

